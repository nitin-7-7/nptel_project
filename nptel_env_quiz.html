<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPTEL Environmental Engineering Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f1e;
    --surface: #111827;
    --surface2: #1a2235;
    --border: rgba(99,179,237,0.15);
    --accent: #3b82f6;
    --accent2: #06b6d4;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --tag-bg: rgba(59,130,246,0.12);
    --tag-text: #93c5fd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
    border-bottom: 1px solid var(--border);
    padding: 2rem 1.5rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -60px; left: 50%;
    transform: translateX(-50%);
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-badge {
    display: inline-block;
    background: var(--tag-bg);
    color: var(--tag-text);
    border: 1px solid rgba(59,130,246,0.3);
    border-radius: 999px;
    font-size: 0.7rem;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 14px;
    margin-bottom: 0.75rem;
  }
  header h1 {
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 700;
    background: linear-gradient(135deg, #93c5fd, #67e8f9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.4rem;
  }
  header p {
    color: var(--muted);
    font-size: 0.85rem;
  }

  /* STATS BAR */
  #stats-bar {
    display: flex;
    gap: 12px;
    padding: 1rem 1.5rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
  }
  .stat-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .stat-pill span { color: var(--text); font-weight: 600; font-family: 'Space Mono', monospace; }
  .progress-wrap {
    flex: 1; min-width: 160px;
    height: 4px;
    background: var(--surface2);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 999px;
    transition: width 0.4s ease;
  }

  /* FILTER BAR */
  #filter-bar {
    display: flex;
    gap: 8px;
    padding: 1rem 1.5rem;
    flex-wrap: wrap;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .filter-btn {
    padding: 5px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 0.75rem;
    font-family: 'Sora', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .filter-btn.active {
    background: var(--tag-bg);
    border-color: rgba(59,130,246,0.4);
    color: var(--tag-text);
  }
  .filter-btn:hover { border-color: rgba(59,130,246,0.4); color: var(--text); }

  /* MAIN */
  #quiz-container {
    max-width: 860px;
    margin: 0 auto;
    padding: 1.5rem;
  }

  /* QUESTION CARD */
  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1.25rem;
    transition: border-color 0.2s;
    position: relative;
  }
  .q-card.answered { border-color: rgba(99,179,237,0.25); }
  .q-card.correct { border-color: rgba(16,185,129,0.35); background: rgba(16,185,129,0.04); }
  .q-card.wrong { border-color: rgba(239,68,68,0.35); background: rgba(239,68,68,0.04); }

  .q-meta {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 0.85rem;
    flex-wrap: wrap;
  }
  .q-num {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--accent2);
    background: rgba(6,182,212,0.1);
    border: 1px solid rgba(6,182,212,0.2);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .q-assign {
    font-size: 0.7rem;
    color: var(--muted);
    background: var(--surface2);
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
  }

  .q-text {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 1rem;
    line-height: 1.65;
  }

  .options { display: flex; flex-direction: column; gap: 8px; }

  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 0.88rem;
    font-family: 'Sora', sans-serif;
    cursor: pointer;
    text-align: left;
    transition: all 0.18s;
    line-height: 1.5;
  }
  .option-btn:hover:not(:disabled) {
    border-color: rgba(59,130,246,0.5);
    background: rgba(59,130,246,0.07);
  }
  .option-btn .opt-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    color: var(--accent);
    min-width: 18px;
    margin-top: 1px;
    font-weight: 700;
  }
  .option-btn.selected { border-color: rgba(59,130,246,0.6); background: rgba(59,130,246,0.1); }
  .option-btn.correct-ans {
    border-color: rgba(16,185,129,0.6) !important;
    background: rgba(16,185,129,0.1) !important;
    color: #6ee7b7 !important;
  }
  .option-btn.wrong-ans {
    border-color: rgba(239,68,68,0.6) !important;
    background: rgba(239,68,68,0.1) !important;
    color: #fca5a5 !important;
  }
  .option-btn:disabled { cursor: default; }

  /* RESULT BADGE */
  .result-badge {
    margin-top: 10px;
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 999px;
    width: fit-content;
  }
  .result-badge.show { display: flex; }
  .result-badge.ok { background: rgba(16,185,129,0.12); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
  .result-badge.no { background: rgba(239,68,68,0.12); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }

  /* SCORE PANEL */
  #score-panel {
    background: linear-gradient(135deg, rgba(59,130,246,0.1), rgba(6,182,212,0.1));
    border: 1px solid rgba(59,130,246,0.3);
    border-radius: 16px;
    padding: 2rem;
    text-align: center;
    margin-bottom: 2rem;
    display: none;
  }
  #score-panel.visible { display: block; }
  #score-panel h2 { font-size: 1.5rem; margin-bottom: 0.5rem; }
  #score-big {
    font-size: 4rem;
    font-weight: 700;
    font-family: 'Space Mono', monospace;
    background: linear-gradient(135deg, #93c5fd, #67e8f9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  #score-label { color: var(--muted); margin-bottom: 1.5rem; }
  .score-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 1.5rem; }
  .score-stat { background: var(--surface); border-radius: 12px; padding: 1rem; }
  .score-stat .val { font-size: 1.5rem; font-weight: 700; font-family: 'Space Mono', monospace; }
  .score-stat .lbl { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .score-stat.g .val { color: #10b981; }
  .score-stat.r .val { color: #ef4444; }
  .score-stat.b .val { color: #3b82f6; }

  /* BUTTONS */
  .btn {
    padding: 10px 24px;
    border-radius: 999px;
    border: none;
    font-family: 'Sora', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
  }
  .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .btn-outline:hover { border-color: rgba(59,130,246,0.4); color: var(--text); }

  .action-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }

  /* JUMP NAV */
  #jump-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 1rem 1.5rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
  }
  #jump-nav.open { max-height: 300px; }
  .jump-dot {
    width: 28px; height: 28px;
    border-radius: 6px;
    font-size: 0.65rem;
    font-family: 'Space Mono', monospace;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .jump-dot:hover { border-color: var(--accent); color: var(--accent); }
  .jump-dot.answered { background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.4); color: var(--accent2); }
  .jump-dot.correct { background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.4); color: #10b981; }
  .jump-dot.wrong { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.4); color: #ef4444; }

  #jump-toggle {
    font-size: 0.75rem;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'Sora', sans-serif;
    padding: 0.5rem 1.5rem;
    display: block;
    width: 100%;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  #jump-toggle:hover { color: var(--text); }

  @media (max-width: 600px) {
    .score-grid { grid-template-columns: repeat(3,1fr); }
    #score-big { font-size: 3rem; }
  }

  .no-results {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--muted);
  }

  .check-icon::before { content: '✓ '; }
  .cross-icon::before { content: '✗ '; }

  .mode-row {
    display: flex; gap: 8px; align-items: center;
    padding: 0.75rem 1.5rem;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .toggle-label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .toggle-label input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
  /* FOOTER */
.site-footer {
  margin-top: 3rem;
  padding: 1.2rem;
  text-align: center;
  background: var(--surface);
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.8rem;
  letter-spacing: 0.05em;
}

.site-footer p {
  background: linear-gradient(135deg, #93c5fd, #67e8f9);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.site-footer p {
  animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
  from { opacity: 0.7; }
  to { opacity: 1; }
}
</style>
</head>
<body>

<header>
  <div class="header-badge">IIT Kharagpur · NPTEL</div>
  <h1>Environmental Engineering &amp; Science</h1>
  <p>Fundamentals &amp; Sustainability Concepts · All Assignments (1–12)</p>
</header>

<div id="stats-bar">
  <div class="stat-pill">Questions <span id="stat-total">0</span></div>
  <div class="stat-pill">Answered <span id="stat-answered">0</span></div>
  <div class="stat-pill">Correct <span id="stat-correct" style="color:#10b981">0</span></div>
  <div class="stat-pill">Wrong <span id="stat-wrong" style="color:#ef4444">0</span></div>
  <div class="progress-wrap">
    <div class="progress-fill" id="progress-fill" style="width:0%"></div>
  </div>
</div>

<button id="jump-toggle">▾ Question Navigator</button>
<div id="jump-nav"></div>

<div id="filter-bar"></div>

<div class="mode-row">
  <label class="toggle-label">
    <input type="checkbox" id="reveal-mode" checked>
    Show answer after selection
  </label>
  <label class="toggle-label" style="margin-left:12px">
    <input type="checkbox" id="shuffle-mode">
    Shuffle options
  </label>
  <button class="btn btn-outline" id="btn-submit-all" style="margin-left:auto;padding:5px 16px;font-size:0.75rem">Submit All &amp; Score</button>
  <button class="btn btn-outline" id="btn-reset" style="padding:5px 16px;font-size:0.75rem">Reset</button>
</div>

<div id="quiz-container">
  <div id="score-panel">
    <h2>Your Score</h2>
    <div id="score-big">0%</div>
    <p id="score-label"></p>
    <div class="score-grid">
      <div class="score-stat g"><div class="val" id="sc-correct">0</div><div class="lbl">Correct</div></div>
      <div class="score-stat r"><div class="val" id="sc-wrong">0</div><div class="lbl">Wrong</div></div>
      <div class="score-stat b"><div class="val" id="sc-skip">0</div><div class="lbl">Skipped</div></div>
    </div>
    <div class="action-row">
      <button class="btn btn-primary" id="btn-retry">Retry Wrong Only</button>
      <button class="btn btn-outline" id="btn-reset2">Full Reset</button>
    </div>
  </div>
  <div id="questions-list"></div>
</div>
<footer class="site-footer">
  <p>Made with ❤️ by <strong>nitin</strong></p>
</footer>

<script>
const QUESTIONS = [
  // ASSIGNMENT 1
  {a:1,q:"The equation I = P × A × T signifies that environmental impact is a function of:",opts:["Pollution, Affluence, and Technology","Population, Affluence, and Technology","Production, Activity, and Time","Population, Agriculture, and Trade"],ans:1},
  {a:1,q:"Compared to pre-Common Era human impacts, post-1800 environmental impacts are best described as:",opts:["Lower but widespread","Higher but localized","Exponentially higher and global","Stable and region-specific"],ans:2},
  {a:1,q:"The ecological footprint of a population primarily measures:",opts:["Carbon emissions per capita","Economic consumption per capita","Land and water required to sustain a given lifestyle","Energy use per unit GDP"],ans:2},
  {a:1,q:"Sustainability, according to the Triple Bottom Line, integrates:",opts:["Technology, policy, and economics","Environment, economy, and society","Growth, equity, and innovation","Energy, water, and materials"],ans:1},
  {a:1,q:"The Brundtland Commission's definition of sustainable development emphasizes:",opts:["Economic growth without constraints","Environmental protection above all else","Technological efficiency as the key solution","Meeting present needs without compromising future needs"],ans:3},
  {a:1,q:"The Montreal Protocol (1987) is best known for addressing:",opts:["Ozone-depleting substances","Greenhouse gas emissions","Hazardous waste management","Water pollution control"],ans:0},
  {a:1,q:"In sustainability engineering, the design stage is critical because it:",opts:["Occurs after construction","Has minimal influence on outcomes","Is driven mainly by regulations","Offers maximum degrees of freedom for sustainable choices"],ans:3},
  {a:1,q:"A key limitation of relying solely on efficiency improvements for sustainability is that:",opts:["Efficiency always increases costs","Efficiency ignores economic growth","Efficiency may lead to overuse of finite resources","Efficiency discourages innovation"],ans:2},
  {a:1,q:"The Cuyahoga River fire (1969) significantly contributed to the establishment of:",opts:["Clean Water Act and EPA","Clean Air Act","Montreal Protocol","Kyoto Protocol"],ans:0},
  {a:1,q:"Urban areas occupy approximately 1% of the Earth's land surface but contribute to nearly:",opts:["20–30% of global GHG emissions","40–50% of global GHG emissions","60–70% of anthropogenic GHG emissions","90% of global GHG emissions"],ans:2},
  // ASSIGNMENT 2
  {a:2,q:"The unit µg/m³ is most appropriately used for reporting pollutant concentrations in:",opts:["Soil","Surface water","Wastewater sludge","Air"],ans:3},
  {a:2,q:"When converting gaseous concentrations between ppmv and µg/m³, which law is fundamentally required?",opts:["Dalton's law","Henry's law","Ideal gas law","Raoult's law"],ans:2},
  {a:2,q:"In a gas mixture, the partial pressure of a component gas is proportional to its:",opts:["Mass fraction","Density","Mole (or volume) fraction","Molecular weight"],ans:2},
  {a:2,q:"Molarity differs from molality because molarity depends on:",opts:["Mass of solvent","Temperature and volume","Molecular weight only","Number of equivalents"],ans:1},
  {a:2,q:"Reporting nitrogen as mg N/L instead of mg/L of individual species is useful because it:",opts:["Eliminates analytical error","Accounts for all nitrogen forms on a common basis","Simplifies laboratory procedures","Avoids molecular weight calculations"],ans:1},
  {a:2,q:"Volatile suspended solids (VSS) are primarily an indicator of:",opts:["Organic matter content","Inorganic salts","Dissolved solids","Turbidity alone"],ans:0},
  {a:2,q:"The Method Detection Limit (MDL) represents:",opts:["The lowest instrument response","The regulatory threshold","The average concentration of samples","The minimum concentration measurable with 99% confidence"],ans:3},
  {a:2,q:"When environmental data are log-normally distributed, the most appropriate measure of central tendency is the:",opts:["Arithmetic mean","Median","Mode","Geometric mean"],ans:3},
  {a:2,q:"What is the partial pressure of CO₂ if its concentration is 420 ppmv and atmospheric pressure is 1 atm?",opts:["4.2 × 10⁻⁶ atm","4.2 × 10⁻⁴ atm","4.2 × 10⁻³ atm","4.2 × 10⁻² atm"],ans:1},
  {a:2,q:"A mineral water analysis gives total cations = 1.0 × 10⁻³ eqv/L and total anions = 0.95 × 10⁻³ eqv/L. Is the analysis acceptable?",opts:["Yes","No","Cannot be determined","Only if bicarbonate is included"],ans:0},
  // ASSIGNMENT 3
  {a:3,q:"Assertion: Biomagnification does not violate the Second Law of Thermodynamics. Reason: Energy decreases between trophic levels, but matter can accumulate.",opts:["Both true, reason explains assertion","Both true, reason does not explain assertion","Assertion true, reason false","Both false"],ans:0},
  {a:3,q:"A lower ecological footprint indicates:",opts:["Higher economic development","Higher population density","Greater consumption","Higher resource efficiency"],ans:3},
  {a:3,q:"Which of the following best distinguishes an ecosystem from a community?",opts:["Ecosystem includes only biotic components","Community includes abiotic components","Community includes only producers","Ecosystem includes biotic and abiotic interactions"],ans:3},
  {a:3,q:"In an aquatic ecosystem, an inverted biomass pyramid is observed. Which combination of conditions makes this possible without violating thermodynamic laws?",opts:["High producer biomass and low productivity","Low producer biomass with very high turnover rate","High consumer biomass with zero respiration losses","Equal productivity across all trophic levels"],ans:1},
  {a:3,q:"Which ecological principle best explains why top carnivores are rare and vulnerable to extinction?",opts:["Second law of thermodynamics","Law of minimum","Competitive exclusion principle","Logistic growth limitation"],ans:0},
  {a:3,q:"Which of the following statements is FALSE?",opts:["Population growth can slow while total population increases","Declining fertility always reduces median age","Aging populations increase dependency ratios","Growth rate approaching zero does not imply zero growth"],ans:1},
  {a:3,q:"A reaction is exothermic but non-spontaneous at low temperature. Which condition must be true?",opts:["ΔH < 0 and ΔS < 0","ΔH > 0 and ΔS > 0","ΔH < 0 and ΔS > 0","ΔG is always negative"],ans:0},
  {a:3,q:"For a first-order decay process, doubling the initial concentration will:",opts:["Double the half-life","Double the time to reach equilibrium","Not change the half-life","Increase the rate constant"],ans:2},
  {a:3,q:"Activity coefficients deviate most significantly from unity when:",opts:["Ionic strength is low and ions are monovalent","Ionic strength is high and ions have high valence","Temperature is low","Concentration approaches zero"],ans:1},
  {a:3,q:"Why are persistent organic pollutants (POPs) especially harmful at higher trophic levels?",opts:["High solubility in water","Rapid degradation","High lipid solubility and low metabolic breakdown","Low molecular weight"],ans:2},
  // ASSIGNMENT 4
  {a:4,q:"Which term in the general mass balance equation becomes zero for a completely mixed batch reactor?",opts:["Accumulation","Reaction","Inflow and outflow","Net generation"],ans:2},
  {a:4,q:"If reaction order increases from first to second order in a batch reactor, the sensitivity of reaction rate to concentration:",opts:["Decreases","Remains constant","Increases","Becomes independent"],ans:2},
  {a:4,q:"Which assumption uniquely defines a CSTR compared to a PFR?",opts:["No inflow","Plug-like velocity","Zero dispersion","Instantaneous complete mixing"],ans:3},
  {a:4,q:"For a first-order reaction in a CSTR, increasing the reactor volume while keeping flow constant will:",opts:["Decrease effluent concentration","Increase effluent concentration","Have no effect","Increase influent concentration"],ans:0},
  {a:4,q:"Which statement correctly distinguishes a PFR from a CSTR?",opts:["Reaction rate is uniform throughout","Concentration varies along reactor length","Effluent equals reactor concentration","Mixing dominates over advection"],ans:1},
  {a:4,q:"Which energy term is irrelevant in a stationary water treatment tank?",opts:["Kinetic energy","Internal energy","Chemical energy","Heat energy"],ans:0},
  {a:4,q:"Without greenhouse gases, Earth's surface temperature would be:",opts:["Higher than present","Same as present","Independent of radiation","Much lower than present"],ans:3},
  {a:4,q:"Earth Overshoot Day shifting earlier indicates:",opts:["Reduced biocapacity","Increased regeneration rate","Decreasing consumption","Improved sustainability"],ans:0},
  {a:4,q:"Which transport mechanism always acts to smooth concentration gradients?",opts:["Advection","Mechanical dispersion","Molecular diffusion","Gravitational settling"],ans:2},
  {a:4,q:"Assertion: Stokes' law applies only at low Reynolds numbers. Reason: At low Reynolds numbers, viscous forces dominate over inertial forces.",opts:["Both true, reason explains assertion","Both true, reason does not explain assertion","Assertion true, reason false","Both false"],ans:0},
  // ASSIGNMENT 5
  {a:5,q:"Which statement most accurately distinguishes COD from BOD₅ in environmental systems?",opts:["COD measures only biodegradable organic matter, while BOD₅ measures total oxidizable matter","COD includes chemically oxidizable organic matter regardless of biodegradability","BOD₅ always exceeds COD for the same wastewater","COD represents oxygen used only by nitrifying bacteria"],ans:1},

let state = {};
let filtered = [];
let currentFilter = 0;

function initState() {
  state = {};
  QUESTIONS.forEach((q, i) => { state[i] = { answered: false, selected: null, correct: null }; });
}

function getAssignments() {
  const set = new Set(QUESTIONS.map(q => q.a));
  return Array.from(set).sort((a,b)=>a-b);
}

function buildFilters() {
  const bar = document.getElementById('filter-bar');
  bar.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'filter-btn active';
  all.textContent = 'All (' + QUESTIONS.length + ')';
  all.dataset.a = 0;
  all.onclick = () => applyFilter(0);
  bar.appendChild(all);
  getAssignments().forEach(a => {
    const cnt = QUESTIONS.filter(q=>q.a===a).length;
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.textContent = 'Assignment ' + a + ' (' + cnt + ')';
    btn.dataset.a = a;
    btn.onclick = () => applyFilter(a);
    bar.appendChild(btn);
  });
}

function applyFilter(a) {
  currentFilter = a;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.a) === a);
  });
  filtered = a === 0 ? QUESTIONS.map((_,i)=>i) : QUESTIONS.map((_,i)=>i).filter(i=>QUESTIONS[i].a===a);
  renderQuestions();
  document.getElementById('score-panel').classList.remove('visible');
}

function shuffle(arr) {
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function renderQuestions() {
  const list = document.getElementById('questions-list');
  list.innerHTML = '';
  if(!filtered.length){ list.innerHTML='<div class="no-results">No questions found.</div>'; return; }

  const shuffleOpts = document.getElementById('shuffle-mode').checked;

  filtered.forEach((qIdx, displayIdx) => {
    const q = QUESTIONS[qIdx];
    const s = state[qIdx];
    const card = document.createElement('div');
    card.className = 'q-card' + (s.answered ? (s.correct ? ' correct' : ' wrong') : '');
    card.id = 'card-' + qIdx;

    let optIndices = q.opts.map((_,i)=>i);
    let shuffleMap = optIndices;
    if(shuffleOpts && !s.answered) { shuffleMap = shuffle(optIndices); }

    const corrLabel = ['A','B','C','D'][q.ans];

    card.innerHTML = `
      <div class="q-meta">
        <span class="q-num">Q${displayIdx+1}</span>
        <span class="q-assign">Assignment ${q.a}</span>
      </div>
      <p class="q-text">${q.q}</p>
      <div class="options" id="opts-${qIdx}"></div>
      <div class="result-badge ${s.answered ? 'show ' + (s.correct?'ok':'no') : ''}" id="badge-${qIdx}">
        ${s.answered ? (s.correct ? '<span class="check-icon"></span>Correct!' : '<span class="cross-icon"></span>Incorrect — correct: ' + corrLabel) : ''}
      </div>`;

    list.appendChild(card);

    const optsDiv = card.querySelector('#opts-'+qIdx);
    shuffleMap.forEach(optI => {
      const label = ['A','B','C','D'][optI];
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      if(s.answered) {
        btn.disabled = true;
        if(optI === q.ans) btn.classList.add('correct-ans');
        else if(s.selected === optI) btn.classList.add('wrong-ans');
      }
      if(s.selected === optI && !s.answered) btn.classList.add('selected');
      btn.innerHTML = `<span class="opt-label">${label}</span><span>${q.opts[optI]}</span>`;
      btn.onclick = () => handleAnswer(qIdx, optI);
      optsDiv.appendChild(btn);
    });
  });

  buildJumpNav();
  updateStats();
}

function handleAnswer(qIdx, optI) {
  const s = state[qIdx];
  const reveal = document.getElementById('reveal-mode').checked;
  if(s.answered && reveal) return;

  s.selected = optI;
  if(reveal) {
    s.answered = true;
    s.correct = (optI === QUESTIONS[qIdx].ans);
  }

  const card = document.getElementById('card-'+qIdx);
  if(!card) return;

  if(reveal) {
    card.className = 'q-card answered ' + (s.correct ? 'correct' : 'wrong');
    const badge = document.getElementById('badge-'+qIdx);
    const corrLabel = ['A','B','C','D'][QUESTIONS[qIdx].ans];
    badge.className = 'result-badge show ' + (s.correct ? 'ok' : 'no');
    badge.innerHTML = s.correct
      ? '<span class="check-icon"></span>Correct!'
      : '<span class="cross-icon"></span>Incorrect — correct: ' + corrLabel;
    card.querySelectorAll('.option-btn').forEach(btn => {
      btn.disabled = true;
      const lbl = btn.querySelector('.opt-label').textContent;
      const bIdx = ['A','B','C','D'].indexOf(lbl);
      if(bIdx === QUESTIONS[qIdx].ans) btn.classList.add('correct-ans');
      else if(bIdx === optI) btn.classList.add('wrong-ans');
    });
  } else {
    card.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
    const buttons = card.querySelectorAll('.option-btn');
    buttons.forEach(btn => {
      const lbl = btn.querySelector('.opt-label').textContent;
      const bIdx = ['A','B','C','D'].indexOf(lbl);
      if(bIdx === optI) btn.classList.add('selected');
    });
  }

  updateStats();
  buildJumpNav();
}

function submitAll() {
  filtered.forEach(qIdx => {
    const s = state[qIdx];
    if(!s.answered) {
      if(s.selected !== null) { s.answered=true; s.correct=(s.selected===QUESTIONS[qIdx].ans); }
    }
  });
  renderQuestions();
  showScore();
}

function showScore() {
  const panel = document.getElementById('score-panel');
  panel.classList.add('visible');
  panel.scrollIntoView({behavior:'smooth',block:'start'});
  const total = filtered.length;
  const correct = filtered.filter(i=>state[i].correct===true).length;
  const wrong = filtered.filter(i=>state[i].answered && state[i].correct===false).length;
  const skip = filtered.filter(i=>!state[i].answered).length;
  const pct = total ? Math.round(correct/total*100) : 0;
  document.getElementById('score-big').textContent = pct + '%';
  document.getElementById('score-label').textContent = correct + ' correct out of ' + total + ' questions';
  document.getElementById('sc-correct').textContent = correct;
  document.getElementById('sc-wrong').textContent = wrong;
  document.getElementById('sc-skip').textContent = skip;
}

function updateStats() {
  const total = filtered.length;
  const answered = filtered.filter(i=>state[i].answered).length;
  const correct = filtered.filter(i=>state[i].correct===true).length;
  const wrong = filtered.filter(i=>state[i].answered && state[i].correct===false).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-answered').textContent = answered;
  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-wrong').textContent = wrong;
  document.getElementById('progress-fill').style.width = (total ? (answered/total*100) : 0) + '%';
}

function buildJumpNav() {
  const nav = document.getElementById('jump-nav');
  nav.innerHTML = '';
  filtered.forEach((qIdx, di) => {
    const s = state[qIdx];
    const dot = document.createElement('button');
    dot.className = 'jump-dot' + (s.answered ? (s.correct ? ' correct' : ' wrong') : (s.selected!==null?' answered':''));
    dot.textContent = di+1;
    dot.title = 'Q'+(di+1)+' – Assignment '+QUESTIONS[qIdx].a;
    dot.onclick = () => {
      document.getElementById('card-'+qIdx)?.scrollIntoView({behavior:'smooth',block:'center'});
    };
    nav.appendChild(dot);
  });
}

function resetAll() {
  initState();
  document.getElementById('score-panel').classList.remove('visible');
  renderQuestions();
}

// INIT
initState();
buildFilters();
applyFilter(0);

document.getElementById('btn-submit-all').onclick = submitAll;
document.getElementById('btn-reset').onclick = resetAll;
document.getElementById('btn-reset2').onclick = resetAll;
document.getElementById('btn-retry').onclick = () => {
  filtered.filter(i=>state[i].correct===false).forEach(i=>{ state[i]={answered:false,selected:null,correct:null}; });
  document.getElementById('score-panel').classList.remove('visible');
  renderQuestions();
};
document.getElementById('jump-toggle').onclick = () => {
  document.getElementById('jump-nav').classList.toggle('open');
};
document.getElementById('reveal-mode').onchange = () => renderQuestions();
document.getElementById('shuffle-mode').onchange = () => renderQuestions();
</script>
</body>
</html>
